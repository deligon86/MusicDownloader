name: Relo Downloader Release Build (Windows)

on:
  push:
    tags:
      # Trigger only on tags that start with 'v' and contain version numbers (e.g., v1.0.0)
      - 'v[0-9]+.[0-9]+.[0-9]+' 
      
env:
  # Set the build type globally for the script to recognize a release environment
  BUILD_TYPE: release
  
  # Directory where the build script and automation tools live
  BUILD_AUTOMATION_DIR: app_builder
  
  # The path to your main build script
  BUILD_SCRIPT: ${{ env.BUILD_AUTOMATION_DIR }}/build.py

jobs:
  build_windows_installer:
    runs-on: windows-latest
    
    # Set environment variables for secrets, required for signing
    env:
      CERT_SOURCE: ${{ secrets.CODE_SIGN_CERT_THUMBPRINT }} # Thumbprint from repository secrets
      CERT_PASSWORD: ${{ secrets.CODE_SIGN_CERT_PASSWORD }} # Password from repository secrets
      
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4
        
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x' # Use a compatible Python version

      # --- Dependency Setup ---

      - name: ⚙️ Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller # Ensure PyInstaller is installed

      - name: 🔑 Import Code Signing Certificate
        # This step is crucial for signing an application in a CI environment.
        # It assumes your certificate is stored as a base64 string in a secret.
        uses: appleboy/cert-action@v1
        with:
          pfx_base64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          pfx_password: ${{ secrets.CODE_SIGN_CERT_PASSWORD }}
          # The resulting thumbprint will match CERT_SOURCE

      - name: 🛠️ Install Inno Setup
        # Installs Inno Setup via Chocolatey, required for the installer creation stage
        uses: chocolatey/install-package@v1
        with:
          package-name: innosetup

      # --- Build, Sign, and Package Pipeline ---

      - name: 🏗️ Run Full Build Pipeline
        id: build
        # Use a temporary environment variable for the tag to bump the correct version part (e.g., 'patch')
        # We assume the tag format 'vMAJOR.MINOR.PATCH' means we bump PATCH.
        run: |
          # Extract version from tag (e.g., 'v1.2.3' -> 'patch')
          $tag = "${{ github.ref_name }}"
          if ($tag -match 'v\d+\.\d+\.\d+') {
             $version_bump = "patch"
          } else {
             $version_bump = "build"
          }
          
          Write-Host "Detected tag: $tag. Running build with version bump: $version_bump"

          # Execute the Python build script with all flags
          python ${{ env.BUILD_SCRIPT }} --full `
            --bump $version_bump `
            --set-build-type release `
            --sign `
            --installer
        shell: powershell

      # --- Artifact Upload ---
      
      - name: 📤 Get Artifact Paths
        id: paths
        # This step determines the exact filenames generated by the build script
        run: |
          $Version = (Get-Content -Raw -Path "${{ env.BUILD_AUTOMATION_DIR }}/version.json" | ConvertFrom-Json).version
          $AppName = "Relo-Downloader"
          
          # Installer path: Relo-Downloader-Installer-vX.Y.Z.W-release.exe
          $InstallerPath = "dist/installers/${AppName}-Installer-v${Version}-release.exe"
          
          # Archive path: Relo-Downloader-vX.Y.Z.W-release-windows-x64.zip
          $ArchivePath = "dist/${AppName}-v${Version}-release-windows-x64.zip"

          echo "INSTALLER_PATH=$InstallerPath" >> $env:GITHUB_OUTPUT
          echo "ARCHIVE_PATH=$ArchivePath" >> $env:GITHUB_OUTPUT
        shell: powershell

      - name: 💾 Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.paths.outputs.INSTALLER_PATH | split('/') | last }}
          path: ${{ steps.paths.outputs.INSTALLER_PATH }}
          if-no-files-found: error
          
      - name: 💾 Upload ZIP Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.paths.outputs.ARCHIVE_PATH | split('/') | last }}
          path: ${{ steps.paths.outputs.ARCHIVE_PATH }}
          if-no-files-found: error

      # --- Create GitHub Release ---

      - name: 📝 Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.paths.outputs.INSTALLER_PATH }}
            ${{ steps.paths.outputs.ARCHIVE_PATH }}
          prerelease: false
          draft: false
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Release Notes: ${{ github.ref_name }}
            
            This is a production release build for Windows.

            **Assets:**
            * Installer: `${{ steps.paths.outputs.INSTALLER_PATH | split('/') | last }}` (Recommended)
            * Portable ZIP: `${{ steps.paths.outputs.ARCHIVE_PATH | split('/') | last }}`